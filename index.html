<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBA Result Analysis Dashboard 2026-27</title>
  <!-- Chart.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .dashboard-container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    h1 {
      text-align: center;
      color: #1a365d;
      margin-bottom: 25px;
    }
    .section-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #2b6cb0;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
      margin-top: 30px;
      margin-bottom: 15px;
    }
    
    /* Charts Grid */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    .chart-card {
      background: #fafafa;
      border: 1fr solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    /* Teacher Input Section */
    .teacher-inputs {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-group label {
      font-weight: 600;
      color: #2d3748;
    }
    .input-group textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.95rem;
      resize: vertical;
      transition: border-color 0.2s;
    }
    .input-group textarea:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
    }
    
    /* Responsive layout for mobile */
    @media (max-width: 768px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <h1>CBA Result Analysis Dashboard 2026-27</h1>

    <!-- Performance Charts Section -->
    <div class="section-title">Performance Analytics</div>
    <div class="charts-grid">
      <!-- Bar Chart Card -->
      <div class="chart-card">
        <canvas id="barChart"></canvas>
      </div>
      <!-- Donut Chart Card -->
      <div class="chart-card">
        <canvas id="donutChart"></canvas>
      </div>
    </div>

    <!-- Teacher Specific Inputs Section -->
    <div class="section-title">Teacher Remarks & Remediation</div>
    <div class="teacher-inputs">
      <div class="input-group">
        <label for="misconceptions">Identified Misconception / Gap (Teacher Input):</label>
        <textarea id="misconceptions" placeholder="Type identified student misconceptions or gaps here..."></textarea>
      </div>

      <div class="input-group">
        <label for="remediation">Action & Remediation Plan (Teacher Input):</label>
        <textarea id="remediation" placeholder="Detail the specific action steps and remediation plan here..."></textarea>
      </div>
    </div>
  </div>

  <script>
    // Initialize Bar Diagram
    const ctxBar = document.getElementById('barChart').getContext('2d');
    new Chart(ctxBar, {
      type: 'bar',
      data: {
        labels: ['Topic 1', 'Topic 2', 'Topic 3', 'Topic 4', 'Topic 5'],
        datasets: [{
          label: 'Average Score (%)',
          data: [72, 58, 85, 44, 69],
          backgroundColor: '#3182ce',
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: 'Topic Performance Analysis (Bar Diagram)',
            font: { size: 14 }
          },
          legend: { display: false }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 100
          }
        }
      }
    });

    // Initialize Donut Chart
    const ctxDonut = document.getElementById('donutChart').getContext('2d');
    new Chart(ctxDonut, {
      type: 'doughnut',
      data: {
        labels: ['Proficient', 'Developing', 'Needs Attention'],
        datasets: [{
          data: [55, 30, 15],
          backgroundColor: ['#38a169', '#ecc94b', '#e53e3e'],
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: 'Student Grade Distribution (Donut Chart)',
            font: { size: 14 }
          }
        }
      }
    });

    // Optional: Persist Teacher Inputs in LocalStorage so entries aren't lost on refresh
    const misconceptionsInput = document.getElementById('misconceptions');
    const remediationInput = document.getElementById('remediation');

    // Load saved values
    misconceptionsInput.value = localStorage.getItem('cba_misconceptions') || '';
    remediationInput.value = localStorage.getItem('cba_remediation') || '';

    // Save values on typing
    misconceptionsInput.addEventListener('input', (e) => {
      localStorage.setItem('cba_misconceptions', e.target.value);
    });
    remediationInput.addEventListener('input', (e) => {
      localStorage.setItem('cba_remediation', e.target.value);
    });
  </script>

</body>
</html>
